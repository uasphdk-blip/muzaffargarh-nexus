<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Muzaffargarh - Next-Gen Command Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyberDark: '#050B14',
                        cyberPanel: 'rgba(13, 22, 38, 0.75)',
                        cyberNeon: '#00F0FF',
                        cyberPurple: '#9D00FF',
                    }
                }
            }
        }
    </script>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        
        .cyber-card {
            background: linear-gradient(135deg, rgba(16, 28, 51, 0.8) 0%, rgba(8, 14, 26, 0.9) 100%);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 240, 255, 0.05);
        }
        
        .cyber-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.1);
        }

        .neon-glow-blue { text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); }

        .cyber-btn {
            background: linear-gradient(90deg, rgba(0,240,255,0.1) 0%, rgba(157,0,255,0.1) 100%);
            border: 1px solid rgba(0, 240, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cyber-btn:hover {
            background: linear-gradient(90deg, rgba(0,240,255,0.25) 0%, rgba(157,0,255,0.25) 100%);
            border-color: #00F0FF;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        /* 3D Colorful Card Effect */
        .box-3d {
            background: linear-gradient(145deg, rgba(20, 32, 58, 0.9), rgba(10, 16, 30, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.3s ease;
        }
        .box-3d:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 15px 35px -5px rgba(0, 240, 255, 0.15), 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .grid-bg {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(5, 11, 20, 0.5); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); border-radius: 4px; }
    </style>
</head>
<body class="bg-cyberDark text-slate-100 min-h-screen flex flex-col grid-bg relative overflow-x-hidden">

    <!-- Ambient Glowing Orbs -->
    <div class="absolute top-0 left-1/4 w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-[600px] h-[600px] bg-purple-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Top Header -->
    <header class="cyber-card border-b border-cyan-500/20 sticky top-0 z-50 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 p-[2px] shadow-lg shadow-cyan-500/30">
                <div class="w-full h-full bg-cyberDark rounded-[10px] flex items-center justify-center">
                    <i class="fa-solid fa-microchip text-cyan-400 text-xl animate-pulse"></i>
                </div>
            </div>
            <div>
                <h1 class="font-cyber font-extrabold text-lg tracking-wider text-white neon-glow-blue">
                    MUZAFFARGARH <span class="text-cyan-400">NEXUS</span>
                </h1>
                <p class="text-[10px] text-cyan-300/70 tracking-widest uppercase font-mono">Autonomous District Grid v5.0</p>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <div class="hidden md:flex items-center space-x-2 px-4 py-1.5 rounded-full bg-cyan-950/40 border border-cyan-500/30 text-xs text-cyan-300 font-mono">

                <span id="liveClock"></span>

    </header>

    <!-- Main Workspace -->
    <main class="flex-1 p-6 lg:p-8 max-w-[1800px] w-full mx-auto flex flex-col gap-6">
        
        <!-- Top Horizontal Filter Bar (Exact Match layout) -->
        <section class="cyber-card rounded-2xl p-4 flex flex-col xl:flex-row items-center justify-between gap-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 w-full">
                
                <!-- Select Police Unit -->
                <div class="space-y-1">

                    <div class="relative">
                        <select id="policeUnitSelect" class="w-full bg-slate-950 border border-cyan-500/30 rounded-xl px-3 py-2.5 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 transition appearance-none cursor-pointer font-mono">

                            <option value="Riaz Abad">Riaz Abad</option>
                            <option value="Khan Pur">Khan Pur</option>
                            <option value="Head M. Wala">Head M. Wala</option>
                            <option value="Jeewana Bangla">Jeewana Bangla</option>
                            <option value="Ghazi Ghat">Ghazi Ghat</option>
                            <option value="Head Bakaini">Head Bakaini</option>
                            <option value="Head Punjnad">Head Punjnad</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-cyan-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Year -->
                <div class="space-y-1">
                    <label class="block text-[10px] font-cyber text-cyan-400 font-semibold tracking-wider">YEAR</label>
                    <div class="relative">
                        <select id="yearSelect" class="w-full bg-slate-950 border border-cyan-500/30 rounded-xl px-3 py-2.5 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 transition appearance-none cursor-pointer font-mono">
                            <!-- Populated via JS -->
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-cyan-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Start Month -->
                <div class="space-y-1">
                    <label class="block text-[10px] font-cyber text-cyan-400 font-semibold tracking-wider">START MONTH</label>
                    <div class="relative">
                        <select id="startMonthSelect" class="w-full bg-slate-950 border border-cyan-500/30 rounded-xl px-3 py-2.5 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 transition appearance-none cursor-pointer font-mono">
                            <option value="January" selected>January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-cyan-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- Close Month -->
                <div class="space-y-1">
                    <label class="block text-[10px] font-cyber text-cyan-400 font-semibold tracking-wider">CLOSE MONTH</label>
                    <div class="relative">
                        <select id="closeMonthSelect" class="w-full bg-slate-950 border border-cyan-500/30 rounded-xl px-3 py-2.5 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 transition appearance-none cursor-pointer font-mono">
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December" selected>December</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-cyan-400 pointer-events-none"></i>
                    </div>
                </div>

            </div>

            <!-- Apply Button -->
            <div class="w-full xl:w-auto flex items-end pt-2 xl:pt-0">
                <button onclick="applyFilters()" class="w-full xl:w-auto px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold tracking-wider transition flex items-center justify-center gap-2 font-cyber shadow-lg shadow-emerald-600/30 cursor-pointer">
                    <i class="fa-solid fa-filter"></i> APPLY
                </button>
            </div>
        </section>

        <!-- Lower Split Grid: All Headings on Left Sidebar & Main Viewport on Right -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Left Sidebar with ALL Headings / Modules (Col-3) -->
            <section class="lg:col-span-3 cyber-card rounded-3xl p-5 flex flex-col gap-4">
                <div class="flex items-center justify-between border-b border-cyan-500/20 pb-3">
                    <h2 class="font-cyber text-xs font-bold uppercase tracking-widest text-cyan-400 flex items-center gap-2">
                        <i class="fa-solid fa-terminal"></i> Command Hub
                    </h2>
                    <span class="text-[10px] bg-cyan-500/10 text-cyan-300 px-2 py-0.5 rounded font-mono border border-cyan-500/30">SECURE</span>
                </div>

                <!-- Scrollable List of ALL Modules/Headings -->
                <div class="space-y-2.5 custom-scroll max-h-[600px] overflow-y-auto pr-1">
                    <label class="font-cyber text-[10px] font-bold uppercase tracking-widest text-cyan-400 block mb-1">All Modules</label>
                    
                    <button onclick="loadModule('Detail of FIRs', 'cyan')" class="cyber-btn w-full p-2.5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 group-hover:scale-110 transition-transform text-xs">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <span class="text-xs font-bold text-white group-hover:text-cyan-300 transition-colors text-left">Detail of FIRs</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-[10px] text-cyan-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="loadModule('Heinous Crime', 'purple')" class="cyber-btn w-full p-2.5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-lg bg-purple-500/10 border border-purple-500/30 flex items-center justify-center text-purple-400 group-hover:scale-110 transition-transform text-xs">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <span class="text-xs font-bold text-white group-hover:text-purple-300 transition-colors text-left">Heinous Crime</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-[10px] text-purple-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="loadModule('E-Challans', 'amber')" class="cyber-btn w-full p-2.5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 group-hover:scale-110 transition-transform text-xs">
                                <i class="fa-solid fa-ticket"></i>
                            </div>
                            <span class="text-xs font-bold text-white group-hover:text-amber-300 transition-colors text-left">E-Challans</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-[10px] text-amber-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="loadModule('PHP Center', 'emerald')" class="cyber-btn w-full p-2.5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition-transform text-xs">
                                <i class="fa-solid fa-shield-dog"></i>
                            </div>
                            <span class="text-xs font-bold text-white group-hover:text-emerald-300 transition-colors text-left">PHP Center</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-[10px] text-emerald-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="loadModule('Accidents & Road Safety', 'blue')" class="cyber-btn w-full p-2.5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-lg bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-400 group-hover:scale-110 transition-transform text-xs">
                                <i class="fa-solid fa-car-burst"></i>
                            </div>
                            <span class="text-xs font-bold text-white group-hover:text-blue-300 transition-colors text-left">Accidents & Safety</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-[10px] text-blue-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="loadModule('Emergency 15 Calls', 'rose')" class="cyber-btn w-full p-2.5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-lg bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 group-hover:scale-110 transition-transform text-xs">
                                <i class="fa-solid fa-phone-volume"></i>
                            </div>
                            <span class="text-xs font-bold text-white group-hover:text-rose-300 transition-colors text-left">Emergency 15 Calls</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-[10px] text-rose-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="loadModule('Recovery & Seizure', 'teal')" class="cyber-btn w-full p-2.5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-lg bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400 group-hover:scale-110 transition-transform text-xs">
                                <i class="fa-solid fa-boxes-stacked"></i>
                            </div>
                            <span class="text-xs font-bold text-white group-hover:text-teal-300 transition-colors text-left">Recovery & Seizure</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-[10px] text-teal-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="loadModule('Patrol & Checkposts', 'indigo')" class="cyber-btn w-full p-2.5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-lg bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition-transform text-xs">
                                <i class="fa-solid fa-route"></i>
                            </div>
                            <span class="text-xs font-bold text-white group-hover:text-indigo-300 transition-colors text-left">Patrol & Checkposts</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-[10px] text-indigo-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="loadModule('Criminal Records / Proclaimed', 'orange')" class="cyber-btn w-full p-2.5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-lg bg-orange-500/10 border border-orange-500/30 flex items-center justify-center text-orange-400 group-hover:scale-110 transition-transform text-xs">
                                <i class="fa-solid fa-user-secret"></i>
                            </div>
                            <span class="text-xs font-bold text-white group-hover:text-orange-300 transition-colors text-left">Criminal Records</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-[10px] text-orange-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="loadModule('District Reporting Center', 'cyan')" class="cyber-btn w-full p-2.5 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-7 h-7 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 group-hover:scale-110 transition-transform text-xs">
                                <i class="fa-solid fa-file-lines"></i>
                            </div>
                            <span class="text-xs font-bold text-white group-hover:text-cyan-300 transition-colors text-left">Reporting Center</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-[10px] text-cyan-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>
            </section>

            <!-- Right Viewport Area (Col-9 - Wide) -->
            <section class="lg:col-span-9 cyber-card rounded-3xl p-6 lg:p-8 flex flex-col min-h-[600px]">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-cyan-500/20 gap-4">
                    <div>
                        <h3 id="displayTitle" class="font-cyber text-xl font-bold text-white tracking-wide">SYSTEM STANDBY</h3>
                        <p id="displaySubtitle" class="text-xs text-cyan-300/70 mt-1 font-mono">Waiting for user command inputs...</p>
                    </div>
                    <button onclick="exportReport()" class="px-4 py-2 bg-cyan-950/60 hover:bg-cyan-900/60 border border-cyan-500/30 rounded-xl text-xs font-semibold text-cyan-300 transition flex items-center gap-2 font-mono cursor-pointer">
                        <i class="fa-solid fa-file-export text-cyan-400"></i> EXPORT REPORT
                    </button>
                </div>

                <!-- Dynamic Workspace Screen -->
                <div id="workspaceContent" class="flex-1 flex flex-col items-center justify-center p-8 text-center my-auto">
                    <div class="w-24 h-24 rounded-3xl bg-cyan-950/30 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-3xl mb-4 shadow-lg shadow-cyan-500/10 animate-pulse">
                        <i class="fa-solid fa-satellite-dish"></i>
                    </div>
                    <h4 class="font-cyber text-white font-bold text-base tracking-wider">GRID READY</h4>
                    <p class="text-slate-400 text-xs max-w-sm mt-2 leading-relaxed">
                        Select filter parameters from the top bar, click <strong class="text-emerald-400">APPLY</strong>, then click any module on the left to load analytics.
                    </p>
                </div>
            </section>

        </div>
    </main>

    <!-- JavaScript Controller -->
    <script>
        // Live Clock
        setInterval(() => {
            const d = new Date();
            document.getElementById('liveClock').innerText = d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
        }, 1000);

        // Populate Years (2016-2026)
        const yearSelect = document.getElementById('yearSelect');
        for (let y = 2016; y <= 2026; y++) {
            let opt = document.createElement('option');
            opt.value = y;
            opt.text = y;
            if(y === 2026) opt.selected = true;
            yearSelect.appendChild(opt);
        }

        // FIRs Sub-heads List
        const firSubHeads = [
            "Illicit Arms", "PEHO ¾,4/79", "Narcotics (CNSA)", "279 PPC", "341 PPC", 
            "285 PPC", "379/411 PPC", "454/457 PPC", "290/291 PPC", "420 PPC", 
            "Amplifieract", "14 Punjab Sc/ordinance 2015", "97-A MVO", "99A MVO", 
            "112/115/3A/89A MVO", "506/341/279/353/186 PPC", "Gambling Act", 
            "322/337G/427/279 PPC", "216A PPC", "170 PPC", "25D Telegraphy act", 
            "ALMR", "Act 1958-9 (Beggars)", "Punjab Food Authority Act", 
            "Punjab Marriage F/Act 2016", "Ehtram-e-Ramzan Act 1981", "Others", "Total"
        ];

        let activeModule = null;

        function applyFilters() {
            const unit = document.getElementById('policeUnitSelect').value;
            const year = document.getElementById('yearSelect').value;
            const startM = document.getElementById('startMonthSelect').value;
            const closeM = document.getElementById('closeMonthSelect').value;

            console.log(`Filters Applied -> Unit: ${unit}, Year: ${year}, Range: ${startM} to ${closeM}`);
            
            if(activeModule) {
                loadModule(activeModule);
            } else {
                alert(`✅ Filter Matrix Updated!\nUnit: ${unit} | Timeline: ${startM} - ${closeM} (${year})`);
            }
        }

        function loadModule(moduleName) {
            activeModule = moduleName;
            const unit = document.getElementById('policeUnitSelect').value;
            const year = document.getElementById('yearSelect').value;
            const startM = document.getElementById('startMonthSelect').value;
            const closeM = document.getElementById('closeMonthSelect').value;

            document.getElementById('displayTitle').innerText = `${moduleName} :: Telemetry Grid`;
            document.getElementById('displaySubtitle').innerText = `Unit: ${unit} // Range: ${startM} to ${closeM} ${year}`;

            if(moduleName === 'Detail of FIRs') {
                let cardsHTML = `<div class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-left custom-scroll max-h-[500px] overflow-y-auto pr-2">`;
                
                firSubHeads.forEach((head, index) => {
                    let randomVal = head === "Total" ? "342" : Math.floor(Math.random() * 25) + 1;
                    let isTotal = head === "Total";
                    
                    let borderColor = isTotal ? "border-cyan-400 shadow-[0_0_20px_rgba(0,240,255,0.3)]" : "border-white/10";
                    let textColor = isTotal ? "text-cyan-300 font-extrabold" : "text-white";
                    let badgeColor = isTotal ? "bg-cyan-500/20 text-cyan-300 border-cyan-500/40" : "bg-blue-500/10 text-blue-400 border-blue-500/20";

                    cardsHTML += `
                        <div class="box-3d p-4 rounded-2xl relative overflow-hidden ${borderColor}">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] font-mono px-2 py-0.5 rounded border ${badgeColor}">FIR-${index+1}</span>
                                <i class="fa-solid fa-chart-pie text-slate-600 text-xs"></i>
                            </div>
                            <h5 class="text-xs font-semibold text-slate-400 tracking-wide line-clamp-1">${head}</h5>
                            <div class="flex items-baseline justify-between mt-2">
                                <h4 class="font-cyber text-2xl ${textColor}">${randomVal}</h4>
                                <span class="text-[9px] text-emerald-400 font-mono"><i class="fa-solid fa-arrow-up"></i> Active</span>
                            </div>
                        </div>
                    `;
                });

                cardsHTML += `</div>`;

                document.getElementById('workspaceContent').innerHTML = `
                    <div class="w-full flex flex-col gap-4">
                        <div class="flex justify-between items-center bg-slate-950/60 p-3 rounded-xl border border-cyan-500/20 font-mono">
                            <span class="text-xs text-cyan-400 font-bold uppercase"><i class="fa-solid fa-cubes mr-2"></i> 3D Matrix Loaded (${firSubHeads.length} Sub-Heads)</span>
                            <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded border border-emerald-500/30">Live Filtered</span>
                        </div>
                        ${cardsHTML}
                    </div>
                `;
            } else {
                document.getElementById('workspaceContent').innerHTML = `
                    <div class="w-full grid grid-cols-1 md:grid-cols-3 gap-5 mb-6 text-left">
                        <div class="box-3d p-6 rounded-2xl">
                            <span class="text-xs font-mono text-cyan-400">TOTAL METRIC</span>
                            <h4 class="font-cyber text-4xl font-extrabold text-white mt-2">156</h4>
                        </div>
                        <div class="box-3d p-6 rounded-2xl">
                            <span class="text-xs font-mono text-purple-400">PROCESSED CASES</span>
                            <h4 class="font-cyber text-4xl font-extrabold text-white mt-2">142</h4>
                        </div>
                        <div class="box-3d p-6 rounded-2xl">
                            <span class="text-xs font-mono text-amber-400">PENDING QUEUE</span>
                            <h4 class="font-cyber text-4xl font-extrabold text-white mt-2">14</h4>
                        </div>
                    </div>
                `;
            }
        }

        function exportReport() {
            alert("📥 Telemetry data export sequence initiated successfully!");
        }
    </script>
</body>
