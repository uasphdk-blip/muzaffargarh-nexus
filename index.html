<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Muzaffargarh - Next-Gen Command Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyberDark: '#050B14',
                        cyberPanel: 'rgba(13, 22, 38, 0.75)',
                        cyberNeon: '#00F0FF',
                        cyberPurple: '#9D00FF',
                    }
                }
            }
        }
    </script>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        
        .cyber-card {
            background: linear-gradient(135deg, rgba(16, 28, 51, 0.8) 0%, rgba(8, 14, 26, 0.9) 100%);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 240, 255, 0.05);
        }
        
        .cyber-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.1);
        }

        .neon-glow-blue { text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); }

        .cyber-btn {
            background: linear-gradient(90deg, rgba(0,240,255,0.05) 0%, rgba(157,0,255,0.05) 100%);
            border: 1px solid rgba(0, 240, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cyber-btn:hover {
            background: linear-gradient(90deg, rgba(0,240,255,0.2) 0%, rgba(157,0,255,0.2) 100%);
            border-color: #00F0FF;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            transform: translateY(-2px);
        }

        .box-3d {
            background: linear-gradient(145deg, rgba(20, 32, 58, 0.9), rgba(10, 16, 30, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.3s ease;
        }
        .box-3d:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 15px 35px -5px rgba(0, 240, 255, 0.15), 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .grid-bg {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(5, 11, 20, 0.5); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); border-radius: 4px; }
    </style>
</head>
<body class="bg-cyberDark text-slate-100 min-h-screen flex flex-col grid-bg relative overflow-x-hidden">

    <!-- Ambient Glowing Orbs -->
    <div class="absolute top-0 left-1/4 w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-[600px] h-[600px] bg-purple-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Top Header -->
    <header class="cyber-card border-b border-cyan-500/20 sticky top-0 z-50 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 p-[2px] shadow-lg shadow-cyan-500/30">
                <div class="w-full h-full bg-cyberDark rounded-[10px] flex items-center justify-center">
                    <i class="fa-solid fa-microchip text-cyan-400 text-xl animate-pulse"></i>
                </div>
            </div>
            <div>
                <h1 class="font-cyber font-extrabold text-lg tracking-wider text-white neon-glow-blue">
                    MUZAFFARGARH <span class="text-cyan-400">NEXUS</span>
                </h1>
                <p class="text-[10px] text-cyan-300/70 tracking-widest uppercase font-mono">Autonomous District Grid v5.0</p>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <div class="hidden md:flex items-center space-x-2 px-4 py-1.5 rounded-full bg-cyan-950/40 border border-cyan-500/30 text-xs text-cyan-300 font-mono">
                <i class="fa-regular fa-clock text-cyan-400"></i>
                <span id="liveClock"></span>
            </div>
            <div class="flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold font-mono">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>SYSTEM SYNCED</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 p-6 lg:p-8 max-w-[1800px] w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Left Sidebar Command Hub (Col-4) -->
        <section class="lg:col-span-4 cyber-card rounded-3xl p-5 flex flex-col gap-5">
            <div class="flex items-center justify-between border-b border-cyan-500/20 pb-4">
                <h2 class="font-cyber text-xs font-bold uppercase tracking-widest text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-terminal"></i> Command Hub
                </h2>
                <span class="text-[10px] bg-cyan-500/10 text-cyan-300 px-2.5 py-0.5 rounded font-mono border border-cyan-500/30">SECURE</span>
            </div>

            <!-- Temporal Matrix Select -->
            <div class="space-y-2">
                <label class="text-[11px] font-semibold text-slate-300 font-mono">Temporal Matrix (Month/Year)</label>
                <div class="relative">
                    <select id="monthSelect" class="w-full bg-slate-950/90 border border-cyan-500/30 rounded-xl px-3 py-3 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 transition appearance-none cursor-pointer font-mono">
                        <option value="" disabled selected>Select Timeline...</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-xs text-cyan-400 pointer-events-none"></i>
                </div>
            </div>

            <!-- Operational Police Stations Select -->
            <div class="space-y-2">
                <label class="text-[11px] font-semibold text-slate-300 font-mono">Operational Police Stations</label>
                <div class="relative">
                    <select id="postSelect" class="w-full bg-slate-950/90 border border-cyan-500/30 rounded-xl px-3 py-3 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 transition appearance-none cursor-pointer font-mono">
                        <option value="" disabled selected>Select Police Station...</option>
                        <option value="all">All Police Stations</option>
                        <option value="riaz-abad">Riaz Abad</option>
                        <option value="khan-pur">Khan Pur</option>
                        <option value="head-m-wala">Head M. Wala</option>
                        <option value="jeewana-bangla">Jeewana Bangla</option>
                        <option value="ghazi-ghat">Ghazi Ghat</option>
                        <option value="head-bakaini">Head Bakaini</option>
                        <option value="head-punjnad">Head Punjnad</option>
                        <option value="hamzay-wali">Hamzay Wali</option>
                        <option value="meer-haji">Meer Haji</option>
                        <option value="khander-meerani">Khander Meerani</option>
                        <option value="gabbar-arain">Gabbar Arain</option>
                        <option value="head-tounsa">Head Tounsa</option>
                        <option value="langar-wah">Langar Wah</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-xs text-cyan-400 pointer-events-none"></i>
                </div>
            </div>

            <hr class="border-cyan-500/10 my-1">

            <!-- MODULES -->
            <div class="space-y-3">
                <label class="font-cyber text-[10px] font-bold uppercase tracking-widest text-cyan-400 block mb-1">MODULES</label>
                
                <button onclick="triggerFIRs()" class="cyber-btn w-full p-3.5 rounded-xl flex items-center justify-between group">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 group-hover:scale-110 transition-transform text-sm">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-xs font-bold text-white group-hover:text-cyan-300 transition-colors">Detail of FIRs</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-[10px] text-cyan-400 group-hover:translate-x-1 transition-transform"></i>
                </button>

                <button onclick="triggerOtherModule('Heinous Crime')" class="cyber-btn w-full p-3.5 rounded-xl flex items-center justify-between group">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg bg-purple-500/10 border border-purple-500/30 flex items-center justify-center text-purple-400 group-hover:scale-110 transition-transform text-sm">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-xs font-bold text-white group-hover:text-purple-300 transition-colors">Heinous Crime</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-[10px] text-purple-400 group-hover:translate-x-1 transition-transform"></i>
                </button>

                <button onclick="triggerOtherModule('E-Challans')" class="cyber-btn w-full p-3.5 rounded-xl flex items-center justify-between group">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 group-hover:scale-110 transition-transform text-sm">
                            <i class="fa-solid fa-ticket"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-xs font-bold text-white group-hover:text-amber-300 transition-colors">E-Challans</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-[10px] text-amber-400 group-hover:translate-x-1 transition-transform"></i>
                </button>

                <button onclick="triggerOtherModule('PHP Center')" class="cyber-btn w-full p-3.5 rounded-xl flex items-center justify-between group">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition-transform text-sm">
                            <i class="fa-solid fa-shield-dog"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-xs font-bold text-white group-hover:text-emerald-300 transition-colors">PHP Center</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-[10px] text-emerald-400 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>
        </section>

        <!-- Right Workspace Area (Col-8) -->
        <section class="lg:col-span-8 cyber-card rounded-3xl p-6 lg:p-8 flex flex-col min-h-[700px]">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-cyan-500/20 gap-4">
                <div>
                    <h3 id="displayTitle" class="font-cyber text-xl font-bold text-white tracking-wide">SYSTEM STANDBY</h3>
                    <p id="displaySubtitle" class="text-xs text-cyan-300/70 mt-1 font-mono">Select parameters from Command Hub and click a module...</p>
                </div>
                <button onclick="exportReport()" class="px-4 py-2 bg-cyan-950/60 hover:bg-cyan-900/60 border border-cyan-500/30 rounded-xl text-xs font-semibold text-cyan-300 transition flex items-center gap-2 font-mono">
                    <i class="fa-solid fa-file-export text-cyan-400"></i> EXPORT REPORT
                </button>
            </div>

            <!-- Workspace Viewport -->
            <div id="workspaceContent" class="flex-1 flex flex-col items-center justify-center p-8 text-center my-auto">
                <div class="w-24 h-24 rounded-3xl bg-cyan-950/30 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-3xl mb-4 shadow-lg shadow-cyan-500/10 animate-pulse">
                    <i class="fa-solid fa-satellite-dish"></i>
                </div>
                <h4 class="font-cyber text-white font-bold text-base tracking-wider">COMMAND HUB READY</h4>
                <p class="text-slate-400 text-xs max-w-sm mt-2 leading-relaxed">
                    Choose Timeline (2004–2026), select a Police Station, and click "Detail of FIRs" to load analytics.
                </p>
            </div>
        </section>

    </main>

    <!-- JavaScript Controller -->
    <script>
        // Live Clock
        setInterval(() => {
            const d = new Date();
            document.getElementById('liveClock').innerText = d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
        }, 1000);

        // Populate Months & Years (2004-2026)
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const monthSelect = document.getElementById('monthSelect');
        for (let y = 2004; y <= 2026; y++) {
            for (let m = 0; m < months.length; m++) {
                let opt = document.createElement('option');
                opt.value = `${months[m]}-${y}`;
                opt.text = `${months[m]} ${y}`;
                monthSelect.appendChild(opt);
            }
        }

        const firSubHeads = [
            "Illicit Arms", "PEHO ¾,4/79", "Narcotics (CNSA)", "279 PPC", "341 PPC", 
            "285 PPC", "379/411 PPC", "454/457 PPC", "290/291 PPC", "420 PPC", 
            "Amplifieract", "14 Punjab Sc/ordinance 2015", "97-A MVO", "99A MVO", 
            "112/115/3A/89A MVO", "506/341/279/353/186 PPC", "Gambling Act", 
            "322/337G/427/279 PPC", "216A PPC", "170 PPC", "25D Telegraphy act", 
            "ALMR", "Act 1958-9 (Beggars)", "Punjab Food Authority Act", 
            "Punjab Marriage F/Act 2016", "Ehtram-e-Ramzan Act 1981", "Others", "Total"
        ];

        function triggerFIRs() {
            const month = monthSelect.value;
            const post = document.getElementById('postSelect').value;

            if(!month || !post) {
                alert("⚠️ Please select Temporal Matrix and Operational Police Station first!");
                return;
            }

            document.getElementById('displayTitle').innerText = `Detail of FIRs :: Telemetry Grid`;
            document.getElementById('displaySubtitle').innerText = `Station: ${post.toUpperCase()} // Timeline: ${month}`;

            let cardsHTML = `<div class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-left custom-scroll max-h-[550px] overflow-y-auto pr-2">`;
            
            firSubHeads.forEach((head, index) => {
                let randomVal = head === "Total" ? "342" : Math.floor(Math.random() * 25) + 1;
                let isTotal = head === "Total";
                
                let borderColor = isTotal ? "border-cyan-400 shadow-[0_0_20px_rgba(0,240,255,0.3)]" : "border-white/10";
                let textColor = isTotal ? "text-cyan-300 font-extrabold" : "text-white";
                let badgeColor = isTotal ? "bg-cyan-500/20 text-cyan-300 border-cyan-500/40" : "bg-blue-500/10 text-blue-400 border-blue-500/20";

                cardsHTML += `
                    <div class="box-3d p-4 rounded-2xl relative overflow-hidden ${borderColor}">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-mono px-2 py-0.5 rounded border ${badgeColor}">FIR-${index+1}</span>
                            <i class="fa-solid fa-chart-pie text-slate-600 text-xs"></i>
                        </div>
                        <h5 class="text-xs font-semibold text-slate-400 tracking-wide line-clamp-1">${head}</h5>
                        <div class="flex items-baseline justify-between mt-2">
                            <h4 class="font-cyber text-2xl ${textColor}">${randomVal}</h4>
                            <span class="text-[9px] text-emerald-400 font-mono"><i class="fa-solid fa-arrow-up"></i> Active</span>
                        </div>
                    </div>
                `;
            });

            cardsHTML += `</div>`;

            document.getElementById('workspaceContent').innerHTML = `
                <div class="w-full flex flex-col gap-4">
                    <div class="flex justify-between items-center bg-slate-950/60 p-3 rounded-xl border border-cyan-500/20 font-mono">
                        <span class="text-xs text-cyan-400 font-bold uppercase"><i class="fa-solid fa-cubes mr-2"></i> 3D Sub-Head Matrix Loaded (${firSubHeads.length} Heads)</span>
                        <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded border border-emerald-500/30">Live Sync</span>
                    </div>
                    ${cardsHTML}
                </div>
            `;
        }

        function triggerOtherModule(moduleName) {
            const month = monthSelect.value;
            const post = document.getElementById('postSelect').value;

            if(!month || !post) {
                alert("⚠️ Please select Temporal Matrix and Operational Police Station first!");
                return;
            }

            document.getElementById('displayTitle').innerText = `${moduleName} :: Telemetry Grid`;
            document.getElementById('displaySubtitle').innerText = `Station: ${post.toUpperCase()} // Timeline: ${month}`;

            document.getElementById('workspaceContent').innerHTML = `
                <div class="w-full grid grid-cols-1 md:grid-cols-3 gap-5 mb-6 text-left">
                    <div class="box-3d p-6 rounded-2xl">
                        <span class="text-xs font-mono text-cyan-400">TOTAL METRIC</span>
                        <h4 class="font-cyber text-4xl font-extrabold text-white mt-2">128</h4>
                    </div>
                    <div class="box-3d p-6 rounded-2xl">
                        <span class="text-xs font-mono text-purple-400">PROCESSED CASES</span>
                        <h4 class="font-cyber text-4xl font-extrabold text-white mt-2">115</h4>
                    </div>
                    <div class="box-3d p-6 rounded-2xl">
                        <span class="text-xs font-mono text-amber-400">PENDING QUEUE</span>
                        <h4 class="font-cyber text-4xl font-extrabold text-white mt-2">13</h4>
                    </div>
                </div>
            `;
        }

        function exportReport() {
            alert("📥 Telemetry data export sequence initiated successfully!");
        }
    </script>
</body>
</html>
